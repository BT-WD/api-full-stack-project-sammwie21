<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Dogs</title>
  <link rel="stylesheet" href="style.css">

  <style>
    img {
      border-radius: 10px;
    }

    button {
      cursor: pointer;
      margin: 5px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Search Dog Breeds</h1>

    <nav>
      <a href="favorites.html">
        <button>❤️ View Favorites</button>
      </a>
      <a href="index.html">Home</a>
      <a href="search.html">Search Dogs</a>
      <a href="match.html">Find Your Match</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Search for a Breed</h2>
      <input type="text" id="search-input" placeholder="Enter breed name...">
      <button id="search-btn">Search</button>
      <button id="random-btn">Random Breed</button>
    </section>

    <section>
      <h3>Results</h3>
      <div id="data-container"></div>
    </section>
  </main>

  <script>
    let breeds = [];

    async function loadBreeds() {
      try {
        const res = await fetch("https://dog.ceo/api/breeds/list/all");
        const data = await res.json();

        const breedData = data.message;

        breeds = Object.keys(breedData);

        Object.entries(breedData).forEach(([breed, subBreeds]) => {
          subBreeds.forEach(sub => {
            breeds.push(`${breed}/${sub}`);
          });
        });

      } catch (err) {
        console.error("Failed to load breeds", err);
      }
    }

    loadBreeds();

    async function searchBreed() {
      const input = document.getElementById("search-input").value.toLowerCase();
      const container = document.getElementById("data-container");

      container.innerHTML = "Loading...";

      try {
        const res = await fetch(`https://dog.ceo/api/breed/${input}/images`);
        const data = await res.json();

        if (data.status !== "success") {
          container.innerHTML = "<p>Breed not found 🐕</p>";
          return;
        }

        container.innerHTML = "";

        data.message.slice(0, 6).forEach(imgUrl => {
          const card = document.createElement("div");
          card.style.display = "inline-block";
          card.style.margin = "10px";
          card.style.textAlign = "center";

          const img = document.createElement("img");
          img.src = imgUrl;
          img.style.width = "200px";

          const label = document.createElement("p");
          label.textContent = input.replace("/", " ");
          label.style.fontWeight = "bold";

          const btn = document.createElement("button");
          btn.textContent = "❤️ Favorite";
          btn.onclick = () => saveFavorite(imgUrl);

          card.appendChild(img);
          card.appendChild(label);
          card.appendChild(btn);

          container.appendChild(card);
        });

      } catch (error) {
        container.innerHTML = "<p>Error fetching data</p>";
      }
    }

    function saveFavorite(imgUrl) {
      let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

      if (!favorites.includes(imgUrl)) {
        favorites.push(imgUrl);
        localStorage.setItem("favorites", JSON.stringify(favorites));
      }
    }

    function randomBreed() {
      if (breeds.length === 0) return;

      const random = breeds[Math.floor(Math.random() * breeds.length)];
      document.getElementById("search-input").value = random;
      searchBreed();
    }

    document.getElementById("search-btn").addEventListener("click", searchBreed);
    document.getElementById("random-btn").addEventListener("click", randomBreed);
  </script>

</body>
</html>
